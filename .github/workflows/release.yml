# Versions and publishes the workspace packages with Changesets, only from
# commits that passed Build Check (build-check.yml: build, lint, types, unit
# and Storybook tests with axe, Firefox and WebKit, SSR and hydration,
# visual regression, size budgets, the built packages, the demo app, the
# registry). The gate requires the whole Build Check run to have succeeded,
# so a job added to it later is covered without changing this file. Every
# job has only the permissions its part needs.
#
#   1. A push to main (or next, the pre-release branch) runs Build Check.
#   2. When that run succeeds, `trigger` (workflow_run) dispatches this
#      workflow on the same branch, if the commit is still the branch's head.
#      The release runs in the dispatched run, not in the workflow_run one,
#      because changesets/action and npm provenance take the branch and the
#      commit from github.ref and github.sha, which a workflow_run run sets
#      to the default branch. A manual "Run workflow" starts here too.
#   3. `gate`: Build Check passed for exactly this commit.
#   4. `plan`: `version` (changesets pending), `publish` (none) or `none`,
#      decided as changesets/action decides it (scripts/release-mode.ts); only
#      for the branch's head.
#   5. version → `version`: opens/updates the "chore(release): version
#      packages" PR (`bun run version-packages`), then approves the PR's
#      Build Check run, which waits for approval (github-actions[bot] is an
#      external contributor), since the ruleset requires its jobs on the PR.
#   6. publish → `pack` (read-only): builds, and packs the versions npm
#      doesn't have yet; then `publish` (npm OIDC, tags, releases; no build):
#      scripts/publish.ts checks the packed plan and tarballs against the
#      plan it computes from this commit and npm, and publishes them; the
#      action pushes the `<name>@<version>` tags and creates the releases,
#      and the job marks @holakirr/snow-ui's release Latest.
#   7. On main, for a release commit (its release tags point at it):
#      `released` waits until npm serves the versions, `verify` installs this
#      commit's registry into fresh apps against npm, and `promote`
#      fast-forwards the `release` branch, which Vercel deploys as
#      snow-ui.holakirr.com: the site always matches npm `latest`.
#   8. `sbom`: attaches each published package's CycloneDX SBOM to its
#      release (retry with "Re-run failed jobs", or mode `sbom` by hand).
#   On `next`, in Changesets pre-release mode (.changeset/pre.json), the
#   versions are `X.Y.Z-next.N` and go to the `next` npm dist-tag; the site
#   doesn't move.
#
# Canary: Actions → Release → Run workflow, on any branch, mode `canary`:
# publishes `0.0.0-canary-<short sha>` versions of the packages with pending
# changesets under the `canary` dist-tag, after the same gate (a PR's Build
# Check counts too). Nothing is committed or tagged. It builds and publishes
# in one job: a dispatch runs the dispatched branch's own copy of this file,
# so the gate and the ref checks here are not security boundaries; a GitHub
# Environment bound to the npm Trusted Publisher would be.
#
# GitHub auth: each job's GITHUB_TOKEN. changesets/action pushes the version
# commit and tags through the GitHub API (its `github-token` input), so
# checkout doesn't need to persist credentials.
#
# npm auth: Trusted Publishing (OIDC, npm >= 11.5 from Node 24 and
# `id-token: write`, only in `publish` and `canary`); no NPM_TOKEN. Each
# package's Trusted Publisher on npmjs.com must point at repo
# holakirr/snow-ui, workflow file release.yml. A package that isn't on npm
# yet can't have one: scripts/publish.ts skips it with a warning until the
# owner publishes its first version by hand (CONTRIBUTING.md, "Publishing a
# new package").

name: Release

run-name: >-
  ${{ github.event_name == 'workflow_run'
    && format('Release trigger: Build Check passed on {0}', github.event.workflow_run.head_branch)
    || format('Release ({0}) on {1}', inputs.mode, github.ref_name) }}

on:
  workflow_run:
    workflows: [Build Check]
    types: [completed]
    branches: [main, next]
  # Dispatched by the `trigger` job, or by hand (e.g. to retry a release, or
  # for a canary).
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          release: version PR or publish (main and next only). canary:
          0.0.0-canary-<sha> snapshots of the pending changesets under the
          `canary` dist-tag (any branch). sbom: attach the SBOMs to the
          GitHub releases of the versions at this ref (a release tag or the
          release branch).
        type: choice
        options: [release, canary, sbom]
        default: release

# One run at a time per branch (a workflow_run run's github.ref is the
# default branch, so the triggers are grouped by the branch Build Check ran
# on); a queued run waits for the running one, and a newer queued run
# replaces an older queued one, which only ever skips an outdated commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

permissions: {}

# Every `run:` step in bash with pipefail (`bash --noprofile --norc -eo
# pipefail {0}`): without an explicit shell GitHub runs `bash -e {0}`, and a
# failing command piped into `tee` or `jq` would pass unnoticed.
defaults:
  run:
    shell: bash

jobs:
  # workflow_run: dispatch the release for the commit Build Check passed on.
  # Only for Build Check runs of pushes to this repository (not of PRs, even
  # from a fork's `main`); this job checks nothing out.
  trigger:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch this workflow
      contents: read # read the branch's head
    steps:
      - name: Dispatch the release on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq .commit.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice title=Release skipped::$BRANCH has moved on from $SHA to $head; the release runs once Build Check passes for $head."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f mode=release
          echo "Dispatched the release of $BRANCH at $SHA."

  # Nothing is published unless Build Check passed for exactly this commit:
  # a run of a push to it or dispatched on it (for a canary, also a PR's
  # run, which tests the branch's head merged into the base). While Build
  # Check is still running, nothing happens: for main and next, its success
  # dispatches the release again.
  gate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'sbom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list the Build Check runs
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Require a green Build Check for ${{ github.sha }}
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          events='["push","workflow_dispatch"]'
          if [ "$MODE" = canary ]; then
            events='["push","workflow_dispatch","pull_request"]'
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-check.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | {event, status, conclusion, html_url}]' \
            | jq -c --argjson events "$events" 'map(select(.event | IN($events[])))')
          passed=$(jq -r 'map(select(.conclusion == "success"))[0].html_url // empty' <<< "$runs")
          if [ -n "$passed" ]; then
            echo "Build Check passed for $GITHUB_SHA: $passed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif jq -e 'any(.[]; .status != "completed")' <<< "$runs" > /dev/null; then
            echo "::notice title=Nothing published::Build Check is still running for $GITHUB_SHA. On main and next the release runs by itself when it passes; for a canary, run this workflow again then."
            echo "passed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=No green Build Check::Build Check has not passed for $GITHUB_SHA ($(jq -r 'map("\(.event): \(.conclusion)") | join(", ") | if . == "" then "no run" else . end' <<< "$runs")). Fix it or re-run it (Actions → Build Check → Run workflow on this branch), then run this workflow again."
            exit 1
          fi

  # Which half of a release this commit needs, decided as changesets/action
  # decides it (scripts/release-mode.ts): `version` (changesets pending),
  # `publish` (none) or `none` (only empty changesets). The halves run in
  # separate jobs with separate permissions. Both only ever run for the
  # branch's head: re-running an old release run would otherwise force-push
  # the version branch back to an old base, or publish an old version as
  # `latest` after a newer one. (The head's own run does that work.) The
  # version and publish jobs check the head again, for "Re-run failed jobs",
  # which doesn't re-run this job.
  plan:
    needs: gate
    # workflow_dispatch can target any branch; only ever version/publish from
    # main and next.
    if: >-
      needs.gate.outputs.passed == 'true' && inputs.mode == 'release' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the changesets, the branch's head
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          # Download Bun, don't restore it from the Actions cache: a cache
          # entry that other workflows' jobs could write must not run here.
          no-cache: true

      # Only @changesets/read and @changesets/pre run here: no install scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Decide the release mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(bun scripts/release-mode.ts)
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" --jq .commit.sha)
          if [ "$mode" != none ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice title=Nothing done::$GITHUB_SHA is no longer the head of $GITHUB_REF_NAME ($head): the release run of the head builds the version PR or publishes."
            mode=none
          fi
          echo "Release mode for $GITHUB_SHA: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # Changesets pending: open or update the "chore(release): version
  # packages" PR (`bun run version-packages`: versions, CHANGELOG.md,
  # bun.lock), then approve the PR's Build Check run, which waits for
  # approval (github-actions[bot] is an external contributor), since the
  # ruleset requires its jobs on the PR. No npm access in this job.
  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the version branch
      pull-requests: write # open/update the version PR
      actions: write # approve (or dispatch) Build Check on the version PR
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          # Download Bun, don't restore it from the Actions cache: a cache
          # entry that other workflows' jobs could write must not run here.
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # `changeset version` and `bun install --lockfile-only` need no install
      # scripts, which would run with this job's write token.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check that ${{ github.sha }} is still the branch's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" --jq .commit.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No version PR::$GITHUB_SHA is no longer the head of $GITHUB_REF_NAME ($head): its own release run builds the version PR."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # publish-script only shapes the PR's text ("merging publishes"): the
      # plan job found changesets, so the action takes the version path. Were
      # it to publish here, it would fail: no packs, no npm OIDC token.
      - name: Create or update the version PR
        id: changesets
        if: steps.head.outputs.current == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun scripts/publish.ts --from-pack-dir packs
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

      # The version PR's checks. Its update starts a `pull_request` Build Check,
      # but the repository requires approval for runs by external
      # contributors (Settings › Actions: all external contributors), and
      # github-actions[bot] is one: the run waits as `action_required`, and the
      # PR stays blocked (a dispatched run on the branch doesn't count for
      # the PR's checks). Approve that run, and only that one: Build Check,
      # event pull_request, by github-actions[bot], from this repository's
      # version branch, on the commit this job just pushed there (the
      # branch's head, read from the branch: the PR's head sha is updated
      # asynchronously and may still be the previous commit). If none shows
      # up, dispatch Build Check on the branch instead.
      - name: Run Build Check on the version PR
        if: steps.head.outputs.current == 'true' && steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/${{ github.ref_name }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha) || [ -z "$sha" ]; then
            echo "::warning title=Build Check not approved::Could not read the head of $BRANCH; approve PR #$PR's Build Check run by hand (Actions › the run › Approve and run)."
            exit 0
          fi
          for _ in $(seq 18); do
            # A failed lookup (e.g. a 5xx) is retried like a missing run.
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-check.yml/runs?head_sha=$sha&event=pull_request&per_page=10" \
              --jq '[.workflow_runs[] | select(.actor.login == "github-actions[bot]" and .head_branch == env.BRANCH and .head_repository.full_name == env.GITHUB_REPOSITORY)][0] | select(.) | "\(.id) \(.conclusion // .status)"') || run=
            case "$run" in
              *" action_required")
                id=${run% *}
                if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null; then
                  echo "Approved Build Check run $id on PR #$PR ($sha)." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                echo "::warning title=Approval failed::Approve Build Check run $id of PR #$PR by hand (Actions › the run › Approve and run)."
                exit 0
                ;;
              ?*)
                echo "Build Check run ${run% *} on PR #$PR ($sha) needs no approval: ${run##* }." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::warning title=No pull_request run::No Build Check run for PR #$PR ($sha) after 3 minutes; dispatching one on $BRANCH (it may not count for the PR's checks)."
          gh workflow run build-check.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # Nothing pending: build the packages and pack the ones npm doesn't have
  # yet, in a job that can't write to the repository or publish to npm, so
  # the build toolchain (tsdown, Tailwind, Terrazzo…) never runs next to a
  # write token or the npm OIDC token. `changeset pack` records each
  # tarball's sha256 in packs/publish-plan.json.
  pack:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.pack.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/publish.ts reads the release tags
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          # Download Bun, don't restore it from the Actions cache: a cache
          # entry that other workflows' jobs could write must not run here.
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      # Packages that aren't on npm yet are left out (scripts/publish.ts).
      # `count`: how many versions there are to publish (0: nothing to do).
      - name: Pack the unpublished versions
        id: pack
        run: |
          bun scripts/publish.ts pack --out-dir packs
          echo "count=$(jq '[.plan[][] | select(.kind == "publish")] | length' packs/publish-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Upload the packs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packs
          path: packs
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Publishes the packed tarballs with npm Trusted Publishing and
  # provenance, then pushes the `<name>@<version>` tags and creates a GitHub
  # release per package. Only changesets, npm and scripts/publish.ts run
  # here: no build, no install scripts, and Bun is downloaded, not restored
  # from a cache. scripts/publish.ts publishes nothing unless the packed plan
  # is the plan it computes itself from this commit and npm, and every
  # tarball is what that plan says (name, version, sha256).
  publish:
    needs: [plan, pack]
    if: needs.plan.outputs.mode == 'publish' && needs.pack.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags, GitHub releases
      id-token: write # npm Trusted Publishing + provenance
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/publish.ts reads the release tags
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          # Download Bun, don't restore it from the Actions cache: a cache
          # entry that other workflows' jobs could write must not run here.
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the packs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packs
          path: packs

      - name: Check that ${{ github.sha }} is still the branch's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" --jq .commit.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Nothing published::$GITHUB_SHA is no longer the head of $GITHUB_REF_NAME ($head): the head's release run publishes."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: changesets
        if: steps.head.outputs.current == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: bun scripts/publish.ts --from-pack-dir packs

      # The action creates one GitHub release per published package, and
      # GitHub marks the last one created "Latest" (the icons or the charts as
      # often as not). The repository's Latest is the library's: the release
      # of @holakirr/snow-ui's version at this commit, also when only another
      # package was published. Only on main: on `next` the library can still
      # be at an older stable version than main has released. The packages
      # are on npm by now, so this step never fails the job.
      - name: Mark the @holakirr/snow-ui release as Latest
        if: steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version packages/ui/package.json)
          tag="@holakirr/snow-ui@$version"
          case "$version" in
            *-*)
              echo "::notice title=Latest unchanged::$tag is a pre-release."
              exit 0
              ;;
          esac
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::warning title=Latest unchanged::$tag has no GitHub release."
          elif ! gh release edit "$tag" --latest --repo "$GITHUB_REPOSITORY" > /dev/null; then
            echo "::warning title=Latest unchanged::Could not mark $tag as Latest; run \`gh release edit '$tag' --latest\`."
          fi

  # Whether this commit is a release commit: one whose `<name>@<version>`
  # tags (pushed by the publish job) point at it. Decided from the
  # repository, not from this run's publish output, so that a re-run or a
  # new run of the same commit (after `verify` failed, or when the publish
  # job had nothing left to publish) still verifies and promotes it, while
  # a later commit that published nothing never moves the site. Then waits
  # until npm serves those versions in the abbreviated metadata that
  # package managers install from (cached apart from `npm view`'s).
  released:
    needs: [plan, pack, publish]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.mode == 'publish' && needs.pack.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the release tags
    outputs:
      released: ${{ steps.tags.outputs.released }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the release tags of ${{ github.sha }}
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          specs=()
          for manifest in packages/*/package.json; do
            spec=$(jq -r 'select(.private != true) | "\(.name)@\(.version)"' "$manifest")
            [ -n "$spec" ] || continue
            target=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$spec" \
              | jq -r --arg ref "refs/tags/$spec" '.[] | select(.ref == $ref) | .object.sha')
            if [ "$target" = "$GITHUB_SHA" ]; then specs+=("$spec"); fi
          done
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "$GITHUB_SHA has no release tags: not a release commit, the site stays where it is."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Release tags at $GITHUB_SHA: ${specs[*]}"
          echo "specs=${specs[*]}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the released versions on npm
        if: steps.tags.outputs.released == 'true'
        env:
          SPECS: ${{ steps.tags.outputs.specs }}
        run: |
          read -r -a specs <<< "$SPECS"
          for spec in "${specs[@]}"; do
            name=${spec%@*}
            version=${spec##*@}
            for _ in $(seq 1 30); do
              if curl -fsS -H 'Accept: application/vnd.npm.install-v1+json' \
                "https://registry.npmjs.org/${name/\//%2f}" \
                | jq -e --arg v "$version" '.versions[$v]' > /dev/null; then
                echo "$spec is on npm"
                continue 2
              fi
              sleep 10
            done
            echo "::error title=Not on npm::npm doesn't serve $spec to package managers after 5 minutes."
            exit 1
          done

  # Before the release branch moves (and with it the site, see `promote`):
  # the registry of this commit, installed with the pinned shadcn CLI into
  # fresh apps against the versions now on npm, not local tarballs: the
  # items' npm ranges must resolve and the published theme must style them.
  verify:
    needs: released
    if: needs.released.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [next, vite, next-shadcn]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          # Download Bun, don't restore it from the Actions cache: a cache
          # entry that other workflows' jobs could write must not run here.
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Registry against npm (${{ matrix.app }})
        run: bun packages/registry/smoke/smoke.ts --published --app ${{ matrix.app }} --work "$RUNNER_TEMP/registry-smoke"

  # snow-ui.holakirr.com (Storybook, the /r registry, llms.txt) is Vercel's
  # production deployment of the `release` branch: it moves only here, to
  # the commit whose packages were just published and verified, so the site
  # always matches npm `latest`. A fast-forward only (never a force push):
  # an older release run finds the branch ahead and leaves it; a branch
  # that doesn't lead to this commit is an error to resolve by hand.
  promote:
    needs: [released, verify]
    if: needs.released.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # move the release branch
    steps:
      - name: Fast-forward the release branch to ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/release" \
            --jq '.[] | select(.ref == "refs/heads/release") | .object.sha')
          if [ -z "$current" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/release -f sha="$GITHUB_SHA" > /dev/null
            echo "Created release at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "release is already at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq .status)
          case "$status" in
            ahead)
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" \
                -f sha="$GITHUB_SHA" -F force=false > /dev/null
              echo "Fast-forwarded release from $current to $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
              ;;
            behind)
              echo "::notice title=release not moved::release ($current) is already past $GITHUB_SHA: a newer release was promoted."
              ;;
            *)
              echo "::error title=release has diverged::release ($current) is not an ancestor of $GITHUB_SHA ($status), so it can't be fast-forwarded. By hand, delete it (git push origin --delete release; this job then creates it) or point it at a release commit (git push --force origin <commit>:refs/heads/release), then re-run this job. See CONTRIBUTING.md, Releases."
              exit 1
              ;;
          esac

  # A CycloneDX SBOM of each published package (scripts/sbom.ts): what it
  # pulls in, at the versions installed from bun.lock. Attached to the
  # package's GitHub release (tag `<name>@<version>`) and kept as an
  # artifact. Its own job, so that a failure is retried with "Re-run failed
  # jobs" (the publish job's outputs are kept); for an older release, run
  # this workflow with mode `sbom` on the release's tag or on `release`.
  sbom:
    needs: publish
    if: >-
      !cancelled() && (needs.publish.outputs.published == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'sbom'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the release assets
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          # Download Bun, don't restore it from the Actions cache: a cache
          # entry that other workflows' jobs could write must not run here.
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # npm sbom reads the installed tree; no install scripts needed.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # After a publish, the published packages. By hand, every package whose
      # GitHub release for its version at this commit exists; only on a
      # release tag or the release branch, whose lockfile is the release's.
      - name: Choose the packages
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.publish.outputs.published-packages }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = sbom ]; then
            case "$GITHUB_REF" in
              refs/tags/*|refs/heads/release) ;;
              *)
                echo "::error title=Wrong ref::Run the sbom mode on a release tag or on the release branch, not on $GITHUB_REF."
                exit 1
                ;;
            esac
            names=()
            for manifest in packages/*/package.json; do
              name=$(jq -r 'select(.private != true) | .name' "$manifest")
              version=$(jq -r .version "$manifest")
              [ -n "$name" ] || continue
              if gh release view "$name@$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                names+=("$name")
              fi
            done
          else
            mapfile -t names < <(jq -r '.[].name' <<< "$PUBLISHED")
          fi
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error title=No packages::No released package to describe at $GITHUB_SHA."
            exit 1
          fi
          echo "names=${names[*]}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOMs
        env:
          NAMES: ${{ steps.packages.outputs.names }}
        run: |
          read -r -a names <<< "$NAMES"
          bun scripts/sbom.ts sbom "${names[@]}" | tee sbom.tsv

      - name: Attach SBOMs to the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r tag file; do
            gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          done < sbom.tsv

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  # `0.0.0-canary-<short sha>` versions of the packages that have pending
  # changesets (and of the packages that depend on them), under the `canary`
  # npm dist-tag: `npm install @holakirr/snow-ui@canary`, or the exact
  # version from the job summary. For trying a change in an app before it is
  # released. Nothing is committed, tagged or released on GitHub.
  canary:
    needs: gate
    if: needs.gate.outputs.passed == 'true' && inputs.mode == 'canary'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          # Download Bun, don't restore it from the Actions cache: a cache
          # entry that other workflows' jobs could write must not run here.
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `.changeset/config.json` names snapshots `0.0.0-{tag}-{commit-short}`.
      # Snapshots aren't allowed in pre-release mode (the `next` branch).
      - name: Version the pending changesets as canary snapshots
        id: version
        env:
          # @changesets/changelog-github looks up each changeset's commit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "::notice title=Nothing to publish::No pending changesets on ${GITHUB_REF_NAME}: a canary publishes the packages that have one."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun changeset version --snapshot canary
          echo "pending=true" >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: steps.version.outputs.pending == 'true'
        run: bun run build

      - name: Publish to npm under the canary dist-tag
        if: steps.version.outputs.pending == 'true'
        run: bun scripts/publish.ts --tag canary --no-git-tag

      - name: Write the published versions
        if: steps.version.outputs.pending == 'true'
        run: |
          {
            echo '### Canary'
            echo '| Package | Install |'
            echo '| --- | --- |'
            for manifest in packages/*/package.json; do
              jq -r 'select(.private != true and (.version | startswith("0.0.0-canary-"))) | "| `\(.name)` | `npm install \(.name)@\(.version)` |"' "$manifest"
            done
          } >> "$GITHUB_STEP_SUMMARY"
