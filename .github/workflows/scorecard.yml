# OpenSSF Scorecard (https://scorecard.dev): checks the repository's
# supply-chain practices (pinned dependencies, token permissions, branch
# protection, code review, dangerous workflow patterns, signed releases…).
# The results are published to the public Scorecard API, which serves the
# README badge, and uploaded to code scanning (Security → Code scanning),
# where each failing check is an alert with its remediation.
#
# Runs weekly, on pushes to main and when the branch protection rules
# change. Read-only apart from the SARIF upload; `publish_results` needs
# `id-token: write` so the API can verify the results come from this
# workflow on the default branch, and restricts the workflow: no workflow-
# or job-level `env` or `defaults`, no `run` steps, only the actions below.
# Public repository: checkout needs no `contents: read` at the job level.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results to the Scorecard API

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
