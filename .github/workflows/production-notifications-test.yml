name: Verify Production Notification Delivery
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit test of the reusable workflow and private delivery
        type: choice
        options: [delivery-test, cancellation-test]
        default: delivery-test
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  cancellation-window:
    if: inputs.operation == 'cancellation-test'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wait for the explicit test cancellation
        run: sleep 90
  verify-call:
    needs: cancellation-window
    if: always() && github.repository == 'holakirr/snow-ui' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/production-notifications.yml
    with:
      release-run-id: ${{ github.run_id }}
    secrets:
      SNOWUI_TELEGRAM_BOT_TOKEN: ${{ secrets.SNOWUI_TELEGRAM_BOT_TOKEN }}
      SNOWUI_TELEGRAM_CHAT_ID: ${{ secrets.SNOWUI_TELEGRAM_CHAT_ID }}
