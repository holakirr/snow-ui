# Exercise the same reusable-workflow boundary as Release, including the
# explicit environment-secret contract. Empty SHAs resolve the active deployments.
name: Production Check
on:
  workflow_dispatch:
permissions: {}
jobs:
  production:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/production-check.yml
    with:
      site-sha: ''
      demo-sha: ''
    secrets:
      SNOWUI_SITE_AUTOMATION_SECRET: ${{ secrets.SNOWUI_SITE_AUTOMATION_SECRET }}
      SNOWUI_DEMO_AUTOMATION_SECRET: ${{ secrets.SNOWUI_DEMO_AUTOMATION_SECRET }}
