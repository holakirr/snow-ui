name: Build Check

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  # The release workflow dispatches Build Check on the version PR's branch
  # (changeset-release/main): the PR is opened with GITHUB_TOKEN, so it
  # triggers no pull_request run, and a dispatched run reports its checks on
  # the PR's head commit, where the ruleset's required checks look for them.
  # Also runnable by hand on any branch (Actions → Build Check → Run workflow),
  # e.g. before publishing a canary from it.
  workflow_dispatch:

# A new push to a PR (or a new dispatch on a branch) supersedes the running
# checks; pushes to main and next always run to the end, because the release
# workflow publishes only commits whose Build Check passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# Every `run:` step in bash with pipefail (`bash --noprofile --norc -eo
# pipefail {0}`): without an explicit shell GitHub runs `bash -e {0}`, and a
# failing command piped into `tee` or `jq` would pass unnoticed.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      # The `visual` job runs in this image: visual/Dockerfile's, pinned by
      # digest, checked below against the installed @playwright/test.
      playwright-image: ${{ steps.playwright.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The visual tests run in the Playwright image that visual/Dockerfile
      # pins by digest (locally through visual/docker.sh, and in the `visual`
      # job). It must be the image of the installed @playwright/test, whose
      # browser the baselines were taken with.
      - name: Get Playwright image
        id: playwright
        run: |
          version=$(jq -r .version node_modules/@playwright/test/package.json)
          image=$(sed -n 's/^FROM //p' visual/Dockerfile)
          case "$image" in
            "mcr.microsoft.com/playwright:v${version}-noble@sha256:"*) ;;
            *)
              echo "::error file=visual/Dockerfile,title=Playwright image mismatch::visual/Dockerfile pins '${image}', but @playwright/test is ${version}. Pin mcr.microsoft.com/playwright:v${version}-noble by digest there and regenerate the baselines (CONTRIBUTING.md, Visual regression tests)."
              exit 1
              ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The DTCG tokens in packages/ui/tokens are the source of truth: the
      # committed files generated from them (CSS, Foundations data,
      # tailwind-merge scales) must be up to date.
      - name: Check generated token files
        run: |
          bun run tokens
          if ! git diff --exit-code || [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error title=Stale generated tokens::The files generated from packages/ui/tokens are out of date. Run \`bun run tokens\` and commit the result."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Figma Code Connect templates (packages/ui/src/components/**/*.figma.ts):
      # `figma connect parse` bundles them as `figma connect publish` would,
      # offline and without a Figma token. Typecheck (above) checks their prop
      # mappings against the components; the ui unit tests run them.
      - name: Check Code Connect templates
        run: bun run code-connect

      # The ui and charts unit tests run with coverage in the storybook-tests
      # job (`bun run test:coverage`), so only the icons tests run here.
      - name: Unit tests (icons)
        run: bun run --filter @holakirr/snow-ui-icons test

      # The release step's decisions (scripts/publish-plan.ts) and the docs
      # pages: a non-empty props table for every exported component, and the
      # page outline (scripts/docs-pages.test.ts).
      - name: Unit tests (scripts)
        run: bun run test:scripts

      # Builds icons, then ui (ui's type declarations import icons' dist), then
      # charts. tsdown runs publint and are-the-types-wrong on every package.
      - name: Build packages
        run: bun run build

      # The published packages: ui's theme.css compiled by a Tailwind v4
      # project (with or without its own `@source` on dist) must generate
      # every component class, theme-core.css only the project's own;
      # index.css layering, fonts.css files, package exports; the charts'
      # exports, 'use client' modules and styles.css (layer, ui tokens).
      - name: Check the built stylesheets
        run: bun run test:dist

      # Storybook, the @snow-ui registry (storybook-static/r) and llms.txt.
      - name: Build Storybook
        run: bun run build:storybook

      # Consumed by the jobs below: the package builds by `size`, `demo` and
      # `registry-smoke`, the Storybook build by `visual` and `docs`.
      - name: Upload package builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload Storybook build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: storybook-static
          if-no-files-found: error
          retention-days: 3

  # Bundle-size budgets from .size-limit.json, measured on the built packages.
  # Plain `size-limit` (no third-party action holding a write token); the
  # report goes to the job summary.
  size:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download package builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: packages

      - name: Check size budgets
        run: |
          set -o pipefail
          bun run size | tee size-limit.txt

      - name: Write size report
        if: ${{ !cancelled() }}
        run: |
          if [ -f size-limit.txt ]; then
            {
              echo '### Size budgets'
              echo '```'
              cat size-limit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Every story rendered in headless Chromium through Vitest browser mode
  # (@storybook/addon-vitest), in the light and the dark theme: render errors,
  # failing play functions and axe violations fail the job. The same run
  # collects coverage of the ui and charts source (with their unit tests)
  # and fails under the thresholds in vitest.config.ts.
  storybook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      STORYBOOK_DISABLE_TELEMETRY: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/playwright/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      # Browsers come from the cache when it hits; the system libraries they
      # need are apt packages and are installed on every run.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Storybook tests (light and dark) with coverage
        run: bun run test:coverage

      - name: Write coverage report
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo '### Coverage (ui and charts unit tests + Storybook tests)'
              echo '| Metric | Covered |'
              echo '| --- | --- |'
              jq -r '.total | to_entries[] | select(.key != "branchesTrue") | "| \(.key) | \(.value.pct)% (\(.value.covered)/\(.value.total)) |"' coverage/coverage-summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  # Every story in headless Firefox and WebKit (Safari's engine), in the light
  # theme: render errors and failing play functions (keyboard, focus,
  # pointer) fail the job (vitest.browsers.config.ts; a failing story is
  # retried once). axe, the dark theme and coverage run in Chromium, in the
  # `storybook-tests` job. One job per browser, in parallel with the others;
  # each caches its browser like `storybook-tests` caches Chromium.
  storybook-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    env:
      STORYBOOK_DISABLE_TELEMETRY: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/playwright/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps ${{ matrix.browser }}

      # WebKit runs in two shards, one after the other, each in a fresh
      # browser: the page's memory grows with every story file, and a full
      # run once crashed it near the end (vitest.browsers.config.ts). A
      # failing story is retried by Vitest; a crashed page fails the whole
      # run instead, so a shard whose page crashed runs once more.
      - name: Storybook tests (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          shards=1
          if [ "$BROWSER" = webkit ]; then shards=2; fi
          for shard in $(seq 1 "$shards"); do
            for attempt in 1 2; do
              if bunx vitest run -c vitest.browsers.config.ts --project "storybook-$BROWSER" --shard "$shard/$shards" 2>&1 | tee vitest.log; then
                break
              fi
              if [ "$attempt" = 1 ] && grep -q "page crashed" vitest.log; then
                echo "::warning title=The $BROWSER page crashed::Shard $shard/$shards: the $BROWSER page crashed (out of memory?), not a story; running the shard again."
                continue
              fi
              exit 1
            done
          done

  # Every ui story rendered on the server (react-dom/server in Node, no DOM),
  # then hydrated on that HTML in headless Chromium (`bun run test:ssr`,
  # ssr/): a story fails when it throws on the server, or when React reports
  # a hydration mismatch or logs an error while hydrating.
  ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/playwright/package.json)" >> "$GITHUB_OUTPUT"

      # The same key as the storybook-tests job: one cached Chromium.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Server rendering and hydration of every ui story
        run: bun run test:ssr

  # Every docs page of the Storybook built by the `build` job (guides, usage
  # pages, automatic docs pages) opened in headless Chromium (`bun run
  # test:docs`, docs-render/): an uncaught exception, a console error,
  # Storybook's error display, or a story on the page (inline or in an
  # iframe) whose render or play function fails, fails the job. No network:
  # remote images get a placeholder, other remote requests fail.
  docs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      # The same key as the storybook-tests job: one cached Chromium.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Download Storybook build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: storybook-static

      - name: Docs pages in the browser
        run: bun run test:docs

      # Pages that only passed on the retry (playwright.config.ts): a warning
      # and the job summary, so a racy page is fixed rather than retried
      # forever.
      - name: Report flaky docs pages
        if: ${{ !cancelled() }}
        run: |
          report=test-results/docs-render/results.json
          [ -f "$report" ] || exit 0
          flaky=$(jq -r '[.. | objects | select(has("specs")) | .specs[] | select(any(.tests[]; .status == "flaky")) | .title] | unique | .[]' "$report")
          [ -n "$flaky" ] || exit 0
          while IFS= read -r page; do
            echo "::warning title=Flaky docs page::$page failed, then passed on the retry: fix the race (see CONTRIBUTING.md, Docs pages in the browser)."
          done <<< "$flaky"
          {
            echo '### Flaky docs pages (passed on the retry)'
            while IFS= read -r page; do echo "- $page"; done <<< "$flaky"
          } >> "$GITHUB_STEP_SUMMARY"

  # Screenshot comparison of every story (light + dark) against the committed
  # linux/arm64 baselines in visual/__screenshots__, in the same Playwright
  # image `bun run visual` uses locally (visual/docker.sh): the one
  # visual/Dockerfile pins by digest, of the installed @playwright/test
  # version. Any difference fails the job; the diffs are uploaded as the
  # `visual-diffs` artifact.
  #
  # The baselines are taken on linux/arm64 (natively on Apple Silicon, where
  # an amd64 image would run emulated, about 4x slower), so the job runs on
  # an arm64 runner: the pinned digest is a multi-platform index and the
  # container resolves to its linux/arm64 variant, the same image as
  # `bun run visual`. setup-bun picks the aarch64 Bun and `bun install` the
  # arm64 native packages; the Storybook build from the `build` job (x64) is
  # static files, the same on any architecture.
  visual:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    container:
      image: ${{ needs.build.outputs.playwright-image }}
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for baselines
        id: baselines
        run: |
          if ls visual/__screenshots__/*.png > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual regression skipped::No baselines in visual/__screenshots__ yet. Generate them with \`bun run visual:update\` (Docker) and commit them to enable this check."
          fi

      # setup-bun extracts a zip; the Playwright image has no unzip.
      - name: Install unzip
        if: steps.baselines.outputs.present == 'true'
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        if: steps.baselines.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.baselines.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Download Storybook build
        if: steps.baselines.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: storybook-static

      - name: Visual regression tests
        if: steps.baselines.outputs.present == 'true'
        run: bun run visual:test

      - name: Upload visual diffs
        if: ${{ failure() && steps.baselines.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: |
            test-results/visual
            playwright-report
          retention-days: 14

  # The demo app (apps/demo), built against the packages from the `build`
  # job the way an app installs them (their exports, i.e. dist): its types,
  # the Next.js production build, then Playwright smoke tests on `next start`
  # (Chromium): every page renders without console errors or axe violations,
  # the theme / language / direction toggles, the command palette, the forms,
  # and First Load JS budgets per route (reported in the job summary).
  demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download package builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: packages

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      # The same key as the storybook-tests job: one cached Chromium.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # Next.js's build cache (Turbopack), keyed by the lockfile and the
      # sources; a stale entry only costs a slower build.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/demo/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/demo/**/*.ts', 'apps/demo/**/*.tsx', 'apps/demo/**/*.css', 'packages/*/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Typecheck the demo
        run: bun run typecheck:demo

      - name: Build the demo
        run: bun run build:demo

      - name: Smoke tests (Playwright, Chromium)
        run: bun run test:demo

      - name: Write First Load JS report
        if: ${{ !cancelled() }}
        run: |
          report=apps/demo/test-results/first-load-js.json
          if [ -f "$report" ]; then
            {
              echo '### Demo: First Load JS per route'
              echo '| Route | Compressed | Uncompressed | Scripts |'
              echo '| --- | --- | --- | --- |'
              jq -r 'to_entries[] | "| `\(.key)` | \(.value.compressedKB) kB | \(.value.uncompressedKB) kB | \(.value.scripts) |"' "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-playwright-report
          path: |
            apps/demo/playwright-report
            apps/demo/test-results
          retention-days: 7

  # The @snow-ui shadcn registry (packages/registry), generated from
  # packages/ui/src: the committed manifest must match the sources, the
  # generator's and the registry's unit tests pass (shadcn's zod schemas,
  # every relative import resolvable within an item and the items it depends
  # on, npm dependencies with ranges, licence headers that survive the CLI,
  # an install block on every usage page), and the pinned shadcn CLI
  # validates and builds it. The deployed copy is built by `build:storybook`.
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the registry manifest
        run: |
          bun run registry
          if ! git diff --exit-code packages/registry/manifest.json; then
            echo "::error title=Stale registry manifest::packages/registry/manifest.json is out of date. Run \`bun run registry\` and commit the result."
            exit 1
          fi

      - name: Unit tests (registry)
        run: bun run --filter @holakirr/snow-ui-registry test

      # Stages the files, runs `shadcn registry validate` and `shadcn build`.
      - name: Validate and build the registry (shadcn CLI)
        run: bun packages/registry/src/cli.ts build --out registry-dist/r --llms registry-dist/llms.txt

  # Installs every registry item with the pinned shadcn CLI, from a local
  # copy of the registry, into fresh apps (create-next-app with RSC; Vite
  # with a strict tsconfig and `rsc: false`; an existing shadcn/ui project),
  # which must typecheck and build (Next.js prerenders a page that renders
  # components and imports every item). The packages come from the `build`
  # job as tarballs, so unreleased versions are tested.
  registry-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        app: [next, vite, next-shadcn]

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download package builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: packages

      - name: Smoke test (${{ matrix.app }})
        run: bun packages/registry/smoke/smoke.ts --app ${{ matrix.app }} --work "$RUNNER_TEMP/registry-smoke"

  # Warns (never fails the PR) when packages changed without a changeset.
  # Docs/CI-only PRs don't need one; `bun changeset --empty` silences it.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for a changeset
        run: |
          if ! bun run changeset status --since=origin/main; then
            echo "::warning title=Missing changeset::Packages changed but no changeset was found. Run \`bun changeset\` (or \`bun changeset --empty\` if no release is needed)."
          fi
