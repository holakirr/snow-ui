# Versions and publishes the workspace packages with Changesets.
#
# On every push to main, changesets/action either:
#   - opens/updates the "chore(release): version packages" PR when there are
#     pending changesets (runs `bun run version-packages`: bumps versions,
#     writes CHANGELOG.md, updates bun.lock), or
#   - publishes every package whose version isn't on npm yet (runs
#     `bun run release`: builds, then `changeset publish`), pushes the
#     `<name>@<version>` git tags and creates a GitHub release per package.
#
# GitHub auth: the action uses the job's GITHUB_TOKEN through its
# `github-token` input (default) and pushes the version commit and tags
# through the GitHub API, so checkout doesn't need to persist credentials.
# PRs opened with GITHUB_TOKEN don't trigger other workflows: re-run the
# checks on the version PR by closing and reopening it (or push to its
# branch) if you want them before merging.
#
# npm auth: Trusted Publishing (OIDC, npm >= 11.5 from Node 24 and
# `id-token: write`); no NPM_TOKEN. Each package's Trusted Publisher on
# npmjs.com must point at repo holakirr/snow-ui, workflow file release.yml.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commit/branch, tags, GitHub releases
      pull-requests: write # open/update the version PR
      id-token: write # npm Trusted Publishing + provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Create version PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
