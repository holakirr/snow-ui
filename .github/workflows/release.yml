# Publishes the package to npm when a GitHub release is published.
#
# Release process:
#   1. Bump "version" in package.json via a regular PR and merge it into main.
#   2. Publish a GitHub release whose tag matches that version (e.g. v2.0.3 or 2.0.3).
# This workflow does not modify or push anything to the repository; it fails if
# the release tag does not match package.json.
#
# npm auth: Trusted Publisher configured on npmjs.com for this repo and
# workflow file (release.yml) with "Allow npm publish" enabled.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bunx vitest run --exclude e2e

      - name: Build
        run: bun run build

      - name: Verify package version matches release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_NAME). Bump the version via PR before publishing the release."
            exit 1
          fi
          echo "Version $PKG_VERSION matches release tag $TAG_NAME"

      - name: Publish to npm
        # Authenticates via npm Trusted Publishing (OIDC, needs npm >= 11.5
        # from Node 24 and `id-token: write`); no NPM_TOKEN is used.
        run: npm publish --provenance --access public
